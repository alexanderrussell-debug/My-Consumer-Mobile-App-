<ion-view view-title="{{ 'MENU.PROFILE' | translate }}">
  <ion-content class="has-header">
    <div class="list">
      <label class="item item-input item-stacked-label">
        <span class="input-label">{{ 'PROFILE.NAME' | translate }}</span>
        <input type="text" ng-model="form.name">
      </label>
      <label class="item item-input item-stacked-label">
        <span class="input-label">{{ 'PROFILE.EMAIL' | translate }}</span>
        <input type="email" ng-model="form.email">
      </label>
      <label class="item item-input item-select">
        <div class="input-label">{{ 'PROFILE.LANGUAGE' | translate }}</div>
        <select ng-model="lang.value" ng-change="setLanguage()">
          <option value="en">English</option>
          <option value="id">Bahasa Indonesia</option>
        </select>
      </label>
    </div>
    <div class="padding">
      <button class="button button-block button-brand" ng-click="save()">{{ 'PROFILE.SAVE' | translate }}</button>
    </div>
    <p class="version">MyMeridian v{{ version }} ({{ env }})</p>
  </ion-content>
</ion-view>
